name: lumi_beauty
description: "Lumi Beauty - ung dung mua sam my pham viet bang Flutter (REST API + SQLite + Provider)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Goi REST API
  http: ^1.2.2
  # Luu gio hang + yeu thich bang SQLite
  sqflite: ^2.4.1
  path: ^1.9.0
  # Luu access token
  shared_preferences: ^2.3.3
  # Cache anh san pham
  cached_network_image: ^3.4.1
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
